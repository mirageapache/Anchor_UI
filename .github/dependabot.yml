# TASK-406：每週檢查兩個生態系。
#
# 1. GitHub Actions：workflow 中的第三方 action 一律釘選 commit SHA（tag 可被改寫，見供應鏈攻擊 tj-actions 事件），
#    由 Dependabot 每週檢查新版本並開 PR 更新 SHA 與後方的版本註解。
# 2. npm：只有一份設定，directory 為根目錄。
#    pnpm workspace 只有根目錄一份 pnpm-lock.yaml，根目錄的設定就會涵蓋整個 workspace（含 examples/*），
#    並同時更新 lockfile。不可為 examples/* 另立設定：那樣的 PR 只改 package.json、不更新根目錄的 lockfile，
#    CI 的 pnpm install --frozen-lockfile 必定失敗（ERR_PNPM_OUTDATED_LOCKFILE），也會與根目錄的 PR 重複。
#    - 一律以 chore 提交（不觸發 release PR）：同一份設定無法讓 lit、@floating-ui/dom 用 fix、
#      範例的 vue、@angular/* 用 chore，而後者不在發布產物中，不應觸發發布。
#      runtime 相依以 ^ 範圍宣告，使用端安裝時本來就會取得新的修補版；runtime 相依的更新隨下一次發布一併釋出。
#    - 次要與修補版本依群組合併為一個 PR，主要版本各自一個 PR（可能需要調整程式）。
#    - vitest、@vitest/*（含 @vitest/browser-playwright）彼此以精確版本互為 peer，合併為同一組一起升級。
#    - @angular/* 須同版號，合併為同一組，且不做主要版本升級：範例鎖定 Angular 19，
#      升級需同時調整 TypeScript（見 pnpm-workspace.yaml 的 overrides）與範例程式，手動進行。
#    - typescript 只接受修補版：pnpm-workspace.yaml 以 overrides 鎖定 ~5.8（Angular 19 的 peer 範圍）。
#    - playwright 不在此更新：版本須與 ci.yml 的 Playwright 容器映像一致（pnpm check:versions 把關），
#      升級時手動一併修改。
#    - 漏洞門檻只看發布套件的 runtime 相依（pnpm audit:runtime，CI lint job）；examples 與開發工具的漏洞
#      由這裡的更新 PR 追蹤，不阻擋發布。
#
# 未涵蓋（需手動更新）：
# - ci.yml 中以 docker run 執行的 rhysd/actionlint 映像（釘選 @sha256 digest）
# - Playwright 容器映像：版本須與 package.json 的 playwright 一致，由 pnpm check:versions 把關
# - smoke/vue3、smoke/angular、smoke/react、smoke/angular-ssr 的 package-lock.json
#   （TASK-307 冒煙測試專案，以 npm ci --ignore-scripts 安裝）：
#   升級相依時於該目錄執行 npm install --package-lock-only 後提交
#   （smoke/angular-ssr 的 playwright 須與根目錄同版，由 pnpm check:versions 把關）
#
# 冷卻期（cooldown）：新版本發布滿 7 天才開 PR。剛發布就被植入惡意程式的版本通常在數天內被下架，
# 因此不追最新的版本（安全性更新不受冷卻期限制）。
#
# 設定只有在預設分支（main）上才生效。PR 目標為 develop（與一般開發相同，經 develop → main 的 PR 執行完整 CI）。
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: ci

  # 整個 pnpm workspace（根目錄的套件與 examples/*）
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      # 一個相依只會歸入第一個符合的群組：特定套件的群組須排在依類型分組的群組之前
      vitest:
        patterns: ['vitest', '@vitest/*']
      angular:
        patterns: ['@angular/*', '@angular-devkit/*']
        update-types: [minor, patch]
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      - dependency-name: playwright
      - dependency-name: '@angular/*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@angular-devkit/*'
        update-types: ['version-update:semver-major']
      - dependency-name: typescript
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
