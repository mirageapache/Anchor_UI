# TASK-406：每週檢查兩個生態系。
#
# 1. GitHub Actions：workflow 中的第三方 action 一律釘選 commit SHA（tag 可被改寫，見供應鏈攻擊 tj-actions 事件），
#    由 Dependabot 每週檢查新版本並開 PR 更新 SHA 與後方的版本註解。
# 2. npm（pnpm workspace，共用根目錄的 pnpm-lock.yaml），根目錄與 examples 分成兩組設定：
#    - 根目錄：runtime 相依（lit、@floating-ui/dom）的更新以 fix(deps) 提交，會列入 CHANGELOG 並觸發
#      release PR；開發相依以 chore(deps-dev) 提交，不觸發發布。
#    - examples/*：vue、@angular/* 等雖為範例的 dependencies，卻不在發布產物中，一律以 chore 提交，
#      避免為未發布的程式觸發 release PR。
#    - 次要與修補版本依類型合併為一個 PR，主要版本各自一個 PR（可能需要調整程式）。
#    - vitest、@vitest/*（含 @vitest/browser-playwright）彼此以精確版本互為 peer，合併為同一組一起升級。
#    - playwright 不在此更新：版本須與 ci.yml 的 Playwright 容器映像一致（pnpm check:versions 把關），
#      升級時手動一併修改。
#    - 漏洞門檻只看發布套件的 runtime 相依（pnpm audit:runtime，CI lint job）；examples 與開發工具的漏洞
#      由這裡的更新 PR 追蹤，不阻擋發布。
#
# 未涵蓋（需手動更新）：
# - ci.yml 中以 docker run 執行的 rhysd/actionlint 映像（釘選 @sha256 digest）
# - Playwright 容器映像：版本須與 package.json 的 playwright 一致，由 pnpm check:versions 把關
# - smoke/vue3、smoke/angular 的 package-lock.json（TASK-307 冒煙測試專案，以 npm ci --ignore-scripts 安裝）：
#   升級相依時於該目錄執行 npm install --package-lock-only 後提交
#
# 冷卻期（cooldown）：新版本發布滿 7 天才開 PR。剛發布就被植入惡意程式的版本通常在數天內被下架，
# runtime 相依的更新又會以 fix(deps) 自動進入 release PR，因此不追最新的版本（安全性更新不受冷卻期限制）。
#
# PR 目標為 develop（與一般開發相同，經 develop → main 的 PR 執行完整 CI）。
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: ci

  # 根目錄（發布的套件）
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      # 須排在 development 之前：一個相依只會歸入第一個符合的群組
      vitest:
        patterns: ['vitest', '@vitest/*']
      runtime:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      - dependency-name: playwright
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope

  # 範例專案：不在發布產物中，一律以 chore 提交
  - package-ecosystem: npm
    directories:
      - /examples/vue3
      - /examples/angular
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      examples:
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope
