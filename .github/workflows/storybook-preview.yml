name: Storybook Preview

# TASK-308: Storybook 自動化預覽部署（GitHub Pages，來源為 gh-pages 分支）。
# - 以 main 為目標的 PR：建置 Storybook 並部署到 pr-preview/pr-<編號>/，在 PR 留言預覽連結；PR 關閉時移除。
# - main 更新：部署到站台根目錄（線上元件文件），保留各 PR 的預覽。
# 流程與一次性設定（啟用 Pages）見 note/07-deployment.md。
#
# 權限分離：建置（執行 PR 的程式碼與相依的建置腳本）只有讀取權限；
# 只有 deploy / cleanup job 取得 contents: write 與 pull-requests: write，只取出兩支部署腳本（與 .nvmrc）、不安裝任何相依。
# deploy job 執行的是 PR 分支上的腳本版本：能在本 repo 開分支的協作者，可經由 PR 改寫 gh-pages（含站台根目錄）而不經審查；
# 來自 fork 的 PR 取得的權杖是唯讀的，因此只建置、不部署。cleanup job 則一律執行 main 上的版本。
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  # PR 關閉時的清除改用 pull_request_target：
  # - pull_request 事件在 PR 有合併衝突時不會觸發，預覽就永遠不會被移除。
  # - pull_request_target 執行的是目標分支（main）上的 workflow 與腳本，不執行 PR 的程式碼，
  #   因此即使是 fork 的 PR 也能安全地取得寫入權限來清除（cleanup job 只用到 PR 編號）。
  pull_request_target:
    branches: [main]
    types: [closed]
  push:
    branches: [main]

permissions:
  contents: read

# 同一個 PR：推送新 commit 或關閉時取消仍在執行的舊 run（關閉後不可再有較舊的部署把預覽放回去）。
# main：同一時間只執行一個、最多一個等候（較新的 push 取代等候中的舊 push），確保站台根目錄最後是最新的 commit；
# 不取消執行中的部署。
concurrency:
  group: storybook-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  build:
    name: Build Storybook
    # PR 關閉（pull_request_target）時不需要建置
    if: github.event_name != 'pull_request_target'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        # 版本取自 package.json 的 packageManager 欄位（唯一來源）

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Storybook
        run: pnpm build-storybook

      - name: Upload the static site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storybook-static
          path: storybook-static/
          if-no-files-found: error
          retention-days: 7

      - name: Explain why fork PRs get no preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: echo "::notice::來自 fork 的 PR 沒有寫入權限，不會部署預覽站台；Storybook 仍已建置並可從 artifact 下載"

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    # 只部署來自本 repo 分支的 PR：其他來源（fork）取得的權杖是唯讀的，無法推送 gh-pages 也無法留言。
    # 以 full_name 比對而不是 head.repo.fork：來源 repo 已刪除時 head.repo 為 null，`!null` 會誤判為可部署。
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    # 不以 concurrency 讓部署排隊：同一群組只保留一個等候中的 run，較早排隊的部署或清除會被取消。
    # 多個部署同時推送 gh-pages 時，由 scripts/pages-deploy.mjs 重新取得最新內容後重試。
    steps:
      # 只取出部署腳本：不需要原始碼，也不安裝任何相依
      - name: Checkout deployment scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            scripts/pages-deploy.mjs
            scripts/pr-preview-comment.mjs
            .nvmrc
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      - name: Download the static site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: storybook-static
          path: storybook-static

      - name: Deploy the PR preview
        if: github.event_name == 'pull_request'
        run: |
          node scripts/pages-deploy.mjs \
            --source storybook-static \
            --target "pr-preview/pr-$PR_NUMBER" \
            --remote "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            --message "chore(pages): deploy preview for PR #$PR_NUMBER (${HEAD_SHA:0:7})"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Comment the preview link on the PR
        if: github.event_name == 'pull_request'
        run: |
          node scripts/pr-preview-comment.mjs \
            --pr "$PR_NUMBER" --state deployed --sha "$HEAD_SHA" --path "pr-preview/pr-$PR_NUMBER"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # 使用自訂網域時，於 repo 的 Variables 設定 PAGES_BASE_URL（未設定時為 <owner>.github.io/<repo>/）
          PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL }}

      - name: Deploy the documentation site (main)
        if: github.event_name == 'push'
        run: |
          node scripts/pages-deploy.mjs \
            --source storybook-static \
            --target . \
            --remote "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            --message "chore(pages): deploy docs from ${GITHUB_SHA:0:7}"
        env:
          GITHUB_TOKEN: ${{ github.token }}

  cleanup:
    name: Remove PR preview
    # PR 關閉（合併或放棄）時移除預覽。由 pull_request_target 觸發：checkout 取得的是目標分支上的腳本，
    # 不含 PR 的任何內容；沒有部署過預覽的 PR（例如來自 fork）不會產生任何變更。
    if: github.event_name == 'pull_request_target'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            scripts/pages-deploy.mjs
            scripts/pr-preview-comment.mjs
            .nvmrc
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      - name: Remove the preview from gh-pages
        run: |
          node scripts/pages-deploy.mjs \
            --remove "pr-preview/pr-$PR_NUMBER" \
            --remote "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            --message "chore(pages): remove preview for PR #$PR_NUMBER"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Update the PR comment
        run: node scripts/pr-preview-comment.mjs --pr "$PR_NUMBER" --state removed
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
