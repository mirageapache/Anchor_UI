name: Release

# TASK-205 / TASK-405：驗證版號與產物後公開 GitHub Release，並附上 tarball
# （由 scripts/pack.mjs 產出：內容同 npm pack，但發布的 package.json 不含 prepare 等安裝時會執行的腳本）。
# - 平常由 release-please.yml 在 release PR 合併、建立 tag 與草稿 Release 後呼叫（workflow_call）。
#   以 GITHUB_TOKEN 建立的 tag 不會觸發 push 事件，因此不再以「推送 v* tag」觸發。
# - 發布中途失敗時，可重跑 Release Please 中失敗的 job，或在 Actions 頁面以 tag 手動執行（workflow_dispatch）；
#   Release 已存在時只會覆蓋上傳 tarball 並公開。
# 流程見 doc/anchor-ui-release-guide.md。
on:
  workflow_call:
    inputs:
      tag:
        description: 要發布的 tag（例如 v0.4.0-beta）
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 要發布的 tag（例如 v0.4.0-beta），須已存在且位於 main 上
        required: true
        type: string

permissions: {}

jobs:
  release:
    name: Verify and publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 40 # 含最多 20 分鐘的 CI 等待
    permissions:
      contents: write
      checks: read
    # 同一個 tag 不可同時執行兩次發布（例如自動觸發與手動重跑重疊）
    concurrency:
      group: release-${{ inputs.tag }}
      cancel-in-progress: false
    steps:
      - name: Validate the tag name
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::tag「${TAG}」不是 v<版號> 格式"
            exit 1
          fi
        env:
          TAG: ${{ inputs.tag }}

      - name: Checkout the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0 # 需要完整歷史以確認 tag 位於 main 上

      - name: Ensure the tag points to a commit on main
        id: tag
        run: |
          git fetch origin main
          sha="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::tag ${TAG} 指向的 commit 不在 main 上；版本必須從 main 發布"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ inputs.tag }}

      # 必要檢查清單取自 main 的 Ruleset（與合併所需的檢查相同）；CI 仍在執行時等待，任一失敗即中止發布
      - name: Wait for required CI checks on main to pass
        run: node scripts/wait-for-ci.mjs --sha "$SHA" --branch main --timeout 20
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.tag.outputs.sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        # 版本取自 package.json 的 packageManager 欄位（唯一來源）

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 建置 → verify:package → size → 版號與 tag 一致性（RELEASE_TAG）→ scripts/pack.mjs 打包
      - name: Build, verify and pack tarball
        run: pnpm release:pack
        env:
          RELEASE_TAG: ${{ inputs.tag }}

      # release-please 建立的是草稿 Release（版本說明取自 CHANGELOG）：附上 tarball 後才公開，
      # 驗證失敗時消費端不會看到沒有 tarball 的 Release。手動執行而 Release 不存在時直接建立。
      - name: Attach the tarball and publish the GitHub Release
        run: |
          # 預覽版：建置資訊（+ 之後）以外的部分含 -（-alpha、-beta…）；例如 1.0.0+build-5 是正式版
          prerelease=false
          case "${TAG%%+*}" in *-*) prerelease=true ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/*.tgz --clobber
            gh release edit "$TAG" --title "$TAG" --draft=false --prerelease="$prerelease"
          else
            flags=(--generate-notes --verify-tag)
            if [ "$prerelease" = true ]; then flags+=(--prerelease); fi
            gh release create "$TAG" release/*.tgz --title "$TAG" "${flags[@]}"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
