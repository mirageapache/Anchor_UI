name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# TASK-214：同一個 PR 推送新 commit 時取消仍在執行的舊 run，讓最新一次不必排隊等候。
# main 的 push 每次自成一組、互不影響：同一組最多只保留一個等候中的 run，連續合併時較早的等候 run
# 會被取消，該 commit 便缺少必要檢查（release.yml 依此判斷能否發布）
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-typecheck:
    name: Lint, Stylelint & Typecheck
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 需要既有 tag 以檢查版號一致性

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        # 版本取自 package.json 的 packageManager 欄位（唯一來源）

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check code formatting (Prettier)
        run: pnpm format:check

      - name: Run ESLint
        run: pnpm lint

      - name: Run Stylelint
        run: pnpm stylelint

      - name: Run TypeScript typecheck
        run: pnpm typecheck

      # 檢查 Playwright 容器映像與套件版本一致、版本皆為精確版本（避免視覺回歸環境分歧）
      - name: Check tool versions are in sync
        run: pnpm check:versions

      # TASK-214：workflow 只有推上 GitHub 才會實際執行，以 actionlint 先檢查語法、job 相依、運算式與 shell 腳本
      - name: Lint GitHub Actions workflows (actionlint)
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7

      # package.json 版號為合法 SemVer，且每個既有 v* tag 所指 commit 的版號都與 tag 一致
      - name: Check release versions and existing tags
        run: pnpm release:verify --all-tags

  build:
    name: Build & Package Verification
    timeout-minutes: 15
    # Fix C-03: build must not run when lint-and-typecheck fails.
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        # 版本取自 package.json 的 packageManager 欄位（唯一來源）

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Anchor UI library (JS + Tokens CSS)
        run: pnpm build

      # TASK-201: 驗證 Tree-shaking（esbuild / Vite 消費端只引用單一元件）、exports / sideEffects 與發布內容
      - name: Verify package (tree-shaking, exports, sideEffects)
        run: pnpm verify:package

      # TASK-202: 各元件入口的體積不得超過預算（基準 +10%，見 .size-limit.mjs），超出即 CI 失敗
      - name: Check bundle size budgets (size-limit)
        run: pnpm size

  size-report:
    name: Size Report (PR comment)
    timeout-minutes: 20
    # TASK-202: 於 PR 留言比較與目標分支的體積差異。僅供參考，體積門禁由 build job 的 pnpm size 負責。
    # 目標分支已導入 size-limit 時，報告失敗會讓此 job 失敗（不再默默略過）。
    if: github.event_name == 'pull_request'
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        # 版本取自 package.json 的 packageManager 欄位（唯一來源）

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      # 目標分支尚未導入 size-limit 時（例如首次導入的 PR）無法比較，此時才容許報告失敗並提出警告
      - name: Check whether the base branch has size-limit configured
        id: base
        run: |
          git fetch --depth=1 origin "$BASE_REF"
          if git cat-file -e FETCH_HEAD:.size-limit.mjs 2>/dev/null; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::目標分支 $BASE_REF 尚未導入 size-limit，本次無法比較體積差異（體積門禁仍由 build job 把關）"
          fi
        env:
          BASE_REF: ${{ github.base_ref }}

      - name: Warn that fork PRs cannot receive the size comment
        if: github.event.pull_request.head.repo.fork
        run: echo "::warning::來自 fork 的 PR 沒有留言權限，不會出現體積差異留言（體積門禁仍由 build job 把關）"

      - name: Report size changes
        uses: andresz1/size-limit-action@v1.8.0
        continue-on-error: ${{ steps.base.outputs.configured != 'true' }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          package_manager: pnpm
          build_script: build

  storybook:
    name: Storybook Interaction Tests
    timeout-minutes: 15
    # TASK-213: 建置 Storybook，並以 Storybook Test Runner 執行所有 story（渲染冒煙測試）與 play function 互動情境。
    # 與 Visual Regression 相同，於 Playwright 官方映像中執行：瀏覽器已預先安裝，版本與 package.json 的 playwright 一致。
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        # 版本取自 package.json 的 packageManager 欄位（唯一來源）

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Storybook
        run: pnpm build-storybook

      - name: Run Storybook interaction tests (play functions)
        run: pnpm test:storybook

  visual:
    name: Visual Regression
    timeout-minutes: 15
    # TASK-203: 於 Playwright 官方映像中截圖比對（版本須與 package.json 的 playwright 一致），
    # 與本機 pnpm test:visual:docker 使用相同環境，避免作業系統渲染差異造成假差異。
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        # 版本取自 package.json 的 packageManager 欄位（唯一來源）

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build design tokens (visual tests load dist/tokens.css)
        run: pnpm build:tokens

      - name: Run visual regression tests
        run: pnpm test:visual

      - name: Upload failed screenshots and diffs
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: visual-regression-diffs
          path: screenshots/Chromium/failed/
          retention-days: 14

      # PR 更新了基準圖時，與目標分支比較並產生 before / after / diff 供審查（並列於 job summary）
      - name: Report baseline changes against the target branch
        id: baseline
        if: github.event_name == 'pull_request'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --depth=1 origin "$BASE_REF"
          node scripts/visual-baseline-diff.mjs --base FETCH_HEAD
        env:
          BASE_REF: ${{ github.base_ref }}

      - name: Upload baseline change images for review
        if: steps.baseline.outputs.changed == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: visual-baseline-changes
          path: screenshots/Chromium/changes/
          retention-days: 14

  test:
    name: Unit, a11y, Coverage & Framework integration
    timeout-minutes: 20
    # TASK-110: a11y 測試需讀取 dist/tokens.css，因此須先 build；同樣在 lint 通過後才執行。
    # Vue / Angular 整合測試透過 workspace 消費建置後的 dist/，同樣依賴 build。
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        # 版本取自 package.json 的 packageManager 欄位（唯一來源）

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build library (a11y tests need dist/tokens.css)
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # test:coverage 會執行全部 *.test.ts（含 *.a11y.test.ts 的 axe-core 檢測），
      # 不再另外跑 test:a11y，避免 a11y 測試重複執行
      - name: Run unit & accessibility tests with coverage (thresholds enforced)
        run: pnpm test:coverage

      - name: Run Vue 3 integration tests
        run: pnpm test:vue

      - name: Run Angular integration tests
        run: pnpm test:angular

      # TASK-214：範例專案的型別檢查與正式建置（Vue SFC 編譯、Angular AOT 模板編譯），
      # 以建置後的 dist/ 驗證消費端的生產建置可通過
      - name: Type-check framework examples
        run: pnpm typecheck:examples

      - name: Build framework examples for production
        run: pnpm build:examples

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  time-budget:
    name: CI Time Budget
    # TASK-214：整體 PR CI 須在 8 分鐘內完成。所有 job 結束後把各 job 的耗時寫入 job summary，
    # 超出預算時發出警告（不讓 CI 失敗，避免 runner 偶爾變慢就擋住合併）。
    needs: [lint-and-typecheck, build, size-report, storybook, visual, test]
    if: ${{ !cancelled() }}
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/ci-time-report.mjs
          sparse-checkout-cone-mode: false

      - name: Report job durations against the 8-minute budget
        run: node scripts/ci-time-report.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_TIME_BUDGET_MINUTES: 8
