name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint, Stylelint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.26.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check code formatting (Prettier)
        run: pnpm format:check

      - name: Run ESLint
        run: pnpm lint

      - name: Run Stylelint
        run: pnpm stylelint

      - name: Run TypeScript typecheck
        run: pnpm typecheck

  build:
    name: Build & Package Verification
    # Fix C-03: build must not run when lint-and-typecheck fails.
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.26.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Anchor UI library (JS + Tokens CSS)
        run: pnpm build

      # TASK-201: 驗證 Tree-shaking（esbuild / Vite 消費端只引用單一元件）、exports / sideEffects 與發布內容
      - name: Verify package (tree-shaking, exports, sideEffects)
        run: pnpm verify:package

      # TASK-202: 各元件入口的體積不得超過預算（基準 +10%，見 .size-limit.mjs），超出即 CI 失敗
      - name: Check bundle size budgets (size-limit)
        run: pnpm size

      - name: Build Storybook documentation
        run: pnpm build-storybook

  size-report:
    name: Size Report (PR comment)
    # TASK-202: 於 PR 留言比較與目標分支的體積差異。僅供參考，體積門禁由 build job 的 pnpm size 負責。
    # 目標分支尚無 size-limit 設定時（例如首次導入的 PR）無法比較，故此步驟失敗不影響 CI 結果。
    if: github.event_name == 'pull_request'
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.26.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Report size changes
        uses: andresz1/size-limit-action@v1.8.0
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          package_manager: pnpm
          build_script: build

  visual:
    name: Visual Regression
    # TASK-203: 於 Playwright 官方映像中截圖比對（版本須與 package.json 的 playwright 一致），
    # 與本機 pnpm test:visual:docker 使用相同環境，避免作業系統渲染差異造成假差異。
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.26.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build design tokens (visual tests load dist/tokens.css)
        run: pnpm build:tokens

      - name: Run visual regression tests
        run: pnpm test:visual

      - name: Upload failed screenshots and diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-diffs
          path: screenshots/chromium/failed/
          retention-days: 14

  test:
    name: Unit, a11y, Coverage & Framework integration
    # TASK-110: a11y 測試需讀取 dist/tokens.css，因此須先 build；同樣在 lint 通過後才執行。
    # Vue / Angular 整合測試透過 workspace 消費建置後的 dist/，同樣依賴 build。
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.26.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build library (a11y tests need dist/tokens.css)
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # test:coverage 會執行全部 *.test.ts（含 *.a11y.test.ts 的 axe-core 檢測），
      # 不再另外跑 test:a11y，避免 a11y 測試重複執行
      - name: Run unit & accessibility tests with coverage (thresholds enforced)
        run: pnpm test:coverage

      - name: Run Vue 3 integration tests
        run: pnpm test:vue

      - name: Run Angular integration tests
        run: pnpm test:angular

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
