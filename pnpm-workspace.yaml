# H-06: packages: 欄位為 Monorepo 預備設定。
# 目前僅包含根套件（單 package 架構）。
# 未來若需拆分子套件（如 @anchor-ui/tokens、@anchor-ui/icons），
# 請新增子目錄並改為：
#   packages:
#     - '.'
#     - 'packages/*'
packages:
  - '.'
  - 'examples/*'

allowBuilds:
  '@parcel/watcher': true
  'esbuild': true
  'lmdb': true
  'msgpackr-extract': true

# 整個 workspace 鎖定 TypeScript 5.8：examples/angular 使用的 @angular/compiler-cli 19.2
# 其 peerDependencies 要求 typescript ">=5.5 <5.9"。升級 Angular 後可一併解除此限制。
overrides:
  typescript: '~5.8.2'
